
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>DADA FANTER Gallery</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:18px;
 background:#070b14;
 color:#fff;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;
 padding:22px 10px;
 border:1px solid #00d9ff;
 border-radius:18px;
 background:linear-gradient(135deg,#101c32,#080d18);
 box-shadow:0 0 18px #00bfff33;
}
.crown{font-size:38px}
h1{margin:8px 0;color:#00e5ff;letter-spacing:2px}
header p{color:#b7c8dc;margin:6px}
.controls{
 max-width:850px;
 margin:20px auto;
 display:flex;
 flex-wrap:wrap;
 gap:10px;
}
input{
 flex:1;
 min-width:180px;
 padding:13px;
 border-radius:10px;
 border:1px solid #00cfff;
 background:#101a2b;
 color:white;
 outline:none;
}
button,.action{
 border:1px solid #00dfff;
 background:#10243a;
 color:#00e5ff;
 padding:11px 16px;
 border-radius:10px;
 font-weight:bold;
 cursor:pointer;
 text-decoration:none;
 display:inline-block;
}
button.active{background:#00cfff;color:#00111b}
#status{text-align:center;color:#9eb4ca;margin:15px}
.gallery{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:13px;
 max-width:1100px;
 margin:auto;
}
.card{
 min-width:0;
 overflow:hidden;
 background:#101827;
 border:1px solid #087eaa;
 border-radius:14px;
 box-shadow:0 0 12px #00bfff18;
}
.card img,.card video{
 width:100%;
 height:170px;
 object-fit:cover;
 display:block;
 background:#05080e;
}
.filename{
 padding:9px 8px;
 color:#d9f7ff;
 font-size:12px;
 overflow-wrap:anywhere;
 text-align:center;
}
.actions{
 display:flex;
 gap:7px;
 padding:0 8px 10px;
}
.actions a{flex:1;text-align:center;font-size:12px;padding:10px 5px}
.delete{
 background:#35121b;
 color:#ff8999;
 border-color:#ff526c;
}
.edit-list{
 display:block;
 width:max-content;
 max-width:100%;
 margin:22px auto;
 text-align:center;
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:10;
 background:#000e;
 align-items:center;
 justify-content:center;
 padding:15px;
}
.modal.show{display:flex}
.modal-content{
 max-width:950px;
 width:100%;
 max-height:90vh;
 text-align:center;
}
.modal-content img,.modal-content video{
 max-width:100%;
 max-height:78vh;
 border-radius:12px;
}
.close{
 margin-top:12px;
 background:#35121b;
 color:white;
 border-color:#ff526c;
}
@media(max-width:420px){
 body{padding:10px}
 .gallery{gap:9px}
 .card img,.card video{height:135px}
 .actions a{font-size:11px}
}
</style>
</head>

<body>

<header>
 <div class="crown">👑</div>
 <h1>DADA FANTER</h1>
 <p>PHOTO & VIDEO GALLERY</p>
</header>

<div class="controls">
 <input id="search" type="search" placeholder="Search photos or videos...">
 <button class="active" data-filter="all">ALL</button>
 <button data-filter="photo">PHOTOS</button>
 <button data-filter="video">VIDEOS</button>
</div>

<div id="status">Loading gallery...</div>
<div class="gallery" id="gallery"></div>

<a class="action edit-list" href="https://github.com/ulfatullah1688-wq/dada-fanter-images/edit/main/media.json" target="_blank">
 EDIT MEDIA LIST
</a>

<div class="modal" id="modal">
 <div class="modal-content">
  <div id="preview"></div>
  <button class="close" onclick="closePreview()">CLOSE</button>
 </div>
</div>

<script>
const MEDIA_BASE =
"https://raw.githubusercontent.com/ulfatullah1688-wq/dada-fanter-images/main/";

const MEDIA_JSON =
"https://raw.githubusercontent.com/ulfatullah1688-wq/dada-fanter-images/main/media.json";

const gallery=document.getElementById("gallery");
const statusBox=document.getElementById("status");
const search=document.getElementById("search");

let allMedia=[];
let currentFilter="all";

function getType(filename){
 return /\.(mp4|webm|mov|m4v|avi)$/i.test(filename)?"video":"photo";
}

function mediaUrl(filename){
 return MEDIA_BASE+encodeURIComponent(filename);
}

function openPreview(filename,type){
 const preview=document.getElementById("preview");
 const url=mediaUrl(filename);

 if(type==="video"){
  preview.innerHTML="";
  const video=document.createElement("video");
  video.src=url;
  video.controls=true;
  video.autoplay=true;
  preview.appendChild(video);
 }else{
  preview.innerHTML="";
  const img=document.createElement("img");
  img.src=url;
  img.alt=filename;
  preview.appendChild(img);
 }

 document.getElementById("modal").classList.add("show");
}

function closePreview(){
 document.getElementById("modal").classList.remove("show");
 document.getElementById("preview").innerHTML="";
}

document.getElementById("modal").addEventListener("click",function(e){
 if(e.target===this)closePreview();
});

function createCard(filename){
 const type=getType(filename);
 const url=mediaUrl(filename);

 const card=document.createElement("div");
 card.className="card";

 let media;

 if(type==="video"){
  media=document.createElement("video");
  media.src=url;
  media.muted=true;
  media.preload="metadata";
  media.playsInline=true;
 }else{
  media=document.createElement("img");
  media.src=url;
  media.loading="lazy";
  media.alt=filename;
 }

 media.onerror=()=>{
  card.style.display="none";
 };

 card.appendChild(media);

 const name=document.createElement("div");
 name.className="filename";
 name.textContent=filename;
 card.appendChild(name);

 const actions=document.createElement("div");
 actions.className="actions";

 const view=document.createElement("a");
 view.className="action";
 view.href="#";
 view.textContent="VIEW";
 view.addEventListener("click",e=>{
  e.preventDefault();
  openPreview(filename,type);
 });

 const del=document.createElement("a");
 del.className="action delete";
 del.textContent="DELETE";

 const issueTitle="DELETE: "+filename;
 del.href="https://github.com/ulfatullah1688-wq/dada-fanter-images/issues/new?title="+encodeURIComponent(issueTitle);

 del.addEventListener("click",e=>{
  if(!confirm("Delete this file?\n\n"+filename+"\n\nGitHub par request submit karni hogi.")){
   e.preventDefault();
  }
 });

 actions.appendChild(view);
 actions.appendChild(del);
 card.appendChild(actions);

 return card;
}

function renderGallery(){
 gallery.innerHTML="";

 const query=search.value.trim().toLowerCase();

 const filtered=allMedia.filter(filename=>{
  const type=getType(filename);
  const matchesType=currentFilter==="all"||currentFilter===type;
  const matchesSearch=filename.toLowerCase().includes(query);
  return matchesType&&matchesSearch;
 });

 filtered.forEach(filename=>{
  gallery.appendChild(createCard(filename));
 });

 statusBox.textContent=
 filtered.length+" media items shown";
}

async function loadGallery(){
 try{
  statusBox.textContent="Loading photos and videos...";

  const response=await fetch(MEDIA_JSON+"?v="+Date.now(),{
   cache:"no-store"
  });

  if(!response.ok){
   throw new Error("GitHub returned HTTP "+response.status);
  }

  const data=await response.json();

  if(!Array.isArray(data)){
   throw new Error("media.json must contain a JSON array");
  }

  allMedia=data.map(item=>{
   if(typeof item==="string")return item;
   if(item&&typeof item==="object")return item.name||item.filename||"";
   return "";
  }).filter(Boolean);

  renderGallery();

  if(allMedia.length===0){
   statusBox.textContent="No media found in media.json";
  }

 }catch(error){
  statusBox.textContent="Could not load GitHub media: "+error.message;
 }
}

document.querySelectorAll("[data-filter]").forEach(button=>{
 button.addEventListener("click",()=>{
  document.querySelectorAll("[data-filter]").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  currentFilter=button.dataset.filter;
  renderGallery();
 });
});

search.addEventListener("input",renderGallery);

loadGallery();
</script>

</body>
</html>
