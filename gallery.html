
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b16">
<title>DADA FANTER | Media Gallery</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 background:radial-gradient(circle at 50% 0,#12314b 0,#081522 38%,#030711 82%);
 color:#effaff;font-family:Arial,Helvetica,sans-serif
}
header{
 padding:30px 16px 22px;text-align:center;
 border-bottom:1px solid #16445e
}
.crown{font-size:38px;filter:drop-shadow(0 0 10px #00cfff)}
h1{font-size:clamp(25px,6vw,38px);letter-spacing:2px;margin:8px 0}
.sub{color:#9cc9df;font-size:13px;letter-spacing:2px}
#status{
 max-width:1100px;margin:20px auto 14px;
 padding:0 14px;color:#9cc9df;font-size:14px
}
#gallery{
 max-width:1100px;margin:0 auto;padding:0 12px 32px;
 display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px
}
.tile{
 position:relative;padding:0;border:1px solid #176080;
 border-radius:15px;overflow:hidden;background:#071523;
 box-shadow:0 0 14px #00a8d51c;cursor:pointer;
 aspect-ratio:1/1;color:white
}
.tile img,.tile video{
 display:block;width:100%;height:100%;object-fit:cover
}
.tile:active{transform:scale(.97)}
.tile .tag{
 position:absolute;left:7px;top:7px;
 background:#001a2bd9;border:1px solid #00cfff;
 border-radius:20px;padding:4px 8px;
 font-size:10px;color:#a8f3ff
}
.tile .play{
 position:absolute;inset:0;display:grid;
 place-items:center;font-size:38px;
 color:white;text-shadow:0 0 12px #00cfff;
 background:#0003;pointer-events:none
}
#viewer{
 position:fixed;inset:0;background:#000f;
 display:none;align-items:center;justify-content:center;
 padding:55px 12px 18px;z-index:5
}
#viewer.open{display:flex}
#viewer img{max-width:100%;max-height:85vh;object-fit:contain;border-radius:10px}
#viewer video{width:100%;max-width:1000px;max-height:85vh;border-radius:10px;background:#000}
#close{
 position:absolute;top:14px;right:16px;
 border:1px solid #4bdcff;background:#071523;
 color:white;border-radius:50%;width:42px;height:42px;font-size:24px
}
.empty{grid-column:1/-1;text-align:center;padding:30px;color:#a9c6d6}
footer{text-align:center;color:#64889d;font-size:12px;padding:10px 16px 28px}
</style>
</head>
<body>

<header>
 <div class="crown">👑</div>
 <h1>DADA FANTER</h1>
 <div class="sub">PHOTO & VIDEO GALLERY</div>
</header>

<div id="status">Loading photos and videos from GitHub...</div>
<main id="gallery"></main>

<footer>Media hosted in the DADA FANTER GitHub repository</footer>

<div id="viewer" role="dialog" aria-modal="true">
 <button id="close" aria-label="Close">×</button>
 <img id="large" alt="Selected photo" style="display:none">
 <video id="largeVideo" controls playsinline style="display:none"></video>
</div>

<script>
const owner="ulfatullah1688-wq";
const repo="dada-fanter-images";
const branch="main";

const statusEl=document.getElementById("status");
const gallery=document.getElementById("gallery");
const viewer=document.getElementById("viewer");
const large=document.getElementById("large");
const largeVideo=document.getElementById("largeVideo");

const mediaExt=/\.(avif|bmp|gif|jpe?g|png|svg|webp|mp4|webm|mov)$/i;
const videoExt=/\.(mp4|webm|mov)$/i;

async function getMedia(path=""){
 const url=`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
 const response=await fetch(url,{
  headers:{"Accept":"application/vnd.github+json"}
 });

 if(!response.ok)throw new Error("GitHub returned HTTP "+response.status);

 const entries=await response.json();
 const files=[];

 for(const entry of entries){
  if(entry.type==="file"&&mediaExt.test(entry.name)){
   files.push({
    name:entry.name,
    url:entry.download_url ||
     `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${entry.path}`,
    video:videoExt.test(entry.name)
   });
  }
  else if(entry.type==="dir"){
   const nested=await getMedia(entry.path);
   files.push(...nested);
  }
 }
 return files;
}

function closeViewer(){
 largeVideo.pause();
 largeVideo.removeAttribute("src");
 largeVideo.load();
 large.removeAttribute("src");
 large.style.display="none";
 largeVideo.style.display="none";
 viewer.classList.remove("open");
}

function showMedia(item){
 viewer.classList.add("open");

 if(item.video){
  large.style.display="none";
  largeVideo.style.display="block";
  largeVideo.src=item.url;
  largeVideo.play().catch(()=>{});
 }else{
  largeVideo.pause();
  largeVideo.style.display="none";
  large.style.display="block";
  large.src=item.url;
 }
}

document.getElementById("close").addEventListener("click",closeViewer);

viewer.addEventListener("click",e=>{
 if(e.target===viewer)closeViewer();
});

document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeViewer();
});

(async()=>{
 try{
  const media=await getMedia();
  const photos=media.filter(x=>!x.video).length;
  const videos=media.filter(x=>x.video).length;

  statusEl.textContent=
   `${photos} Photos • ${videos} Videos • ${media.length} Total Media`;

  if(!media.length){
   gallery.innerHTML='<div class="empty">No photos or videos found.</div>';
   return;
  }

  media.reverse().forEach(item=>{
   const button=document.createElement("button");
   button.className="tile";
   button.type="button";
   button.title=item.name;

   if(item.video){
    const video=document.createElement("video");
    video.src=item.url;
    video.muted=true;
    video.preload="metadata";
    video.playsInline=true;
    button.appendChild(video);

    const play=document.createElement("div");
    play.className="play";
    play.textContent="▶";
    button.appendChild(play);

    const tag=document.createElement("span");
    tag.className="tag";
    tag.textContent="VIDEO";
    button.appendChild(tag);
   }else{
    const img=document.createElement("img");
    img.loading="lazy";
    img.alt=item.name;
    img.src=item.url;
    button.appendChild(img);

    const tag=document.createElement("span");
    tag.className="tag";
    tag.textContent="PHOTO";
    button.appendChild(tag);
   }

   button.addEventListener("click",()=>showMedia(item));
   gallery.appendChild(button);
  });

 }catch(error){
  console.error(error);
  statusEl.textContent="Could not load GitHub media.";
  gallery.innerHTML=
   '<div class="empty">GitHub media could not be loaded. Please refresh later. Error: '+
   error.message+'</div>';
 }
})();
</script>
</body>
</html>
